# Checks the sandbox's bootstrap (bootstrap/) on each change of it:
# scripts/check-bootstrap.sh --helm, its files, the commands of
# bootstrap/README.md against bootstrap/charts.yaml, the pins of the charts (sha256,
# digest) against their repositories and registries, helm template of each
# release with its values, no image without a digest, and the admission policies of
# bootstrap/protection against their fixtures (bootstrap/protection/tests). Nothing is installed nor published.

name: bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - "bootstrap/**"
      - "scripts/check-bootstrap.sh"
      - "scripts/bump-bootstrap.sh"
      - "scripts/policytest/**"
      - ".github/workflows/bootstrap.yml"
  push:
    branches:
      - '**'
    paths:
      - "bootstrap/**"
      - "scripts/check-bootstrap.sh"
      - "scripts/bump-bootstrap.sh"
      - "scripts/policytest/**"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  HELM_VERSION: v4.3.0

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # The CEL admission policies are evaluated without a cluster (scripts/policytest,
      # k8s.io/apiserver's own admission code).
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: scripts/policytest/go.mod
          cache-dependency-path: scripts/policytest/go.sum

      # yq v4 is on the runner's image.
      - name: Check the bootstrap
        run: scripts/check-bootstrap.sh --helm
