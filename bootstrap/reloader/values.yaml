# Reloader: a dependency of the platform, installed with helm (bootstrap/README.md),
# from the upstream chart reloader 2.2.17 of
# https://stakater.github.io/stakater-charts:
#   helm upgrade --install reloader reloader --repo https://stakater.github.io/stakater-charts \
#     --version 2.2.17 -n kube-tools --create-namespace --wait -f bootstrap/reloader/values.yaml
# Restarts the workloads annotated reloader.stakater.com/auto (or .../search) when a
# ConfigMap or Secret they mount changes: a rotated credential, a new CA bundle.
# By digest (scripts/bump-bootstrap.sh): the chart renders repository@digest.
image:
  digest: sha256:def2480040adc164b3a57340e77674eadfd88fb7f0593df25e93297f29c7fd7c
reloader:
  deployment:
    securityContext:
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
