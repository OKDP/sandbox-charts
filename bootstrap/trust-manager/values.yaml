# trust-manager: a dependency of the platform, installed with helm after cert-manager
# (bootstrap/README.md), from the upstream chart trust-manager v0.25.0 of
# https://charts.jetstack.io, in cert-manager's namespace, where it reads the CA
# Secrets of the Bundle (bootstrap/trust-manager/bundle.yaml):
#   helm upgrade --install trust-manager trust-manager --repo https://charts.jetstack.io \
#     --version v0.25.0 -n cert-manager --wait -f bootstrap/trust-manager/values.yaml
app:
  trust:
    namespace: cert-manager
  webhook:
    tls:
      # Its webhook's certificate from cert-manager, not generated by helm.
      helmCert:
        enabled: false
commonLabels:
  okdp.io/protected: "true"
crds:
  enabled: true
  keep: true
# The images by digest (scripts/bump-bootstrap.sh): the controller's, and the default
# package's, the trust bundle of the system's CAs.
image:
  repository: quay.io/jetstack/trust-manager
  digest: sha256:0521921c2a46d14d0417336b20bcde69215ef3164f2977cc939d53c6e5224a17
defaultPackageImage:
  digest: sha256:3093d4f6634fbd9eaf6a70a06d809132850d7cae30da82396d3b1f884c1135e7
# The Bundle writes a Secret too (global.okdp.tls.caBundleSecret of the platform
# values, certs-bundle): trust-manager may write that one only.
secretTargets:
  enabled: true
  authorizedSecrets:
    - certs-bundle
