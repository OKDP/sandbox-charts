# The CA trust bundle of the platform: the public CAs and the sandbox's CA (the Secret
# default-issuer of bootstrap/cert-issuers), written by trust-manager to every
# namespace, those created later included, applied after the cluster issuers
# (bootstrap/README.md):
#   kubectl apply -f bootstrap/trust-manager/bundle.yaml
# The Secret certs-bundle (key ca.crt, and bundle.p12) is global.okdp.tls.caBundleSecret
# of the platform values, which the services and the bootstrap's Forgejo mount; the
# ConfigMap certs-bundle (key root-certs.pem) is for the clients that read PEM files.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: certs-bundle
  labels:
    app.kubernetes.io/name: certs-bundle
    app.kubernetes.io/part-of: okdp-sandbox
spec:
  sources:
    - useDefaultCAs: true
    - secret:
        name: default-issuer
        key: tls.crt
  target:
    additionalFormats:
      pkcs12:
        key: bundle.p12
    configMap:
      key: root-certs.pem
    secret:
      key: ca.crt
    namespaceSelector:
      matchLabels: {}
