  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: app
      namespace: demo
      annotations: {nginx.ingress.kubernetes.io/server-alias: 'a.demo.okdp.sandbox, evil.example.com'}
    spec:
      rules:
      - {host: airflow.demo.okdp.sandbox}
- name: an Ingress with server aliases of its own
  allow: true
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: networking.k8s.io
  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: app
      namespace: demo
      annotations: {nginx.ingress.kubernetes.io/server-alias: 'a.demo.okdp.sandbox

          b.demo.okdp.sandbox'}
    spec:
      rules:
      - {host: airflow.demo.okdp.sandbox}
- name: an Ingress with a foreign external-dns hostname
