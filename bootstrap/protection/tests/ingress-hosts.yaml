    kind: Ingress
    metadata: {name: app, namespace: s3-system}
    spec:
      rules:
      - {host: s3.okdp.sandbox}
- name: an Ingress annotated with a foreign common name
  allow: false
  message: annotations
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: networking.k8s.io
  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: app
      namespace: demo
      annotations: {cert-manager.io/common-name: keycloak.okdp.sandbox}
    spec:
      rules:
      - {host: airflow.demo.okdp.sandbox}
- name: an Ingress annotated with its own common name
  allow: true
