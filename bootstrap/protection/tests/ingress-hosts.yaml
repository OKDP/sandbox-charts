# okdp-ingress-hosts: the hosts of an Ingress and a Certificate (rules, tls, dnsNames,
# commonName, the annotations that name hosts) in a namespace that is not the platform's
# own: <label>.<namespace>.<suffix>, or a host listed for the namespace in the param. Run by
# scripts/check-bootstrap.sh (scripts/policytest).
policies: ../ingress-hosts.yaml
policy: okdp-ingress-hosts
namespaces: ../../namespaces.yaml
params:
- apiVersion: v1
  kind: ConfigMap
  metadata: {name: okdp-ingress-hosts, namespace: kube-tools}
  data: {suffix: okdp.sandbox, hosts.demo: 'grafana.okdp.sandbox, other.okdp.sandbox'}
cases:
- name: an Ingress for the project's own host
  allow: true
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: networking.k8s.io
  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: app, namespace: demo}
    spec:
      rules:
      - {host: airflow.demo.okdp.sandbox}
      tls:
      - hosts: [airflow.demo.okdp.sandbox]
        secretName: x
- name: an Ingress updated with its own host
  allow: true
  operation: UPDATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: networking.k8s.io
  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: app, namespace: demo}
    spec:
      rules:
      - {host: airflow.demo.okdp.sandbox}
- name: an Ingress for upper-case letters of its own host
  allow: true
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: networking.k8s.io
  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: app, namespace: demo}
    spec:
      rules:
      - {host: Airflow.Demo.OKDP.sandbox}
- name: an Ingress for the identity provider's host
  allow: false
  message: hosts <label>.demo.okdp.sandbox
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: networking.k8s.io
  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: app, namespace: demo}
    spec:
      rules:
      - {host: keycloak.okdp.sandbox}
- name: an Ingress for another project's host
  allow: false
  message: hosts <label>.demo.okdp.sandbox
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: networking.k8s.io
  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: app, namespace: demo}
    spec:
      rules:
      - {host: airflow.team.okdp.sandbox}
- name: an Ingress for a host with two labels before the namespace
  allow: false
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: networking.k8s.io
  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: app, namespace: demo}
    spec:
      rules:
      - {host: a.b.demo.okdp.sandbox}
- name: an Ingress for a host whose label starts with a dash
  allow: false
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: networking.k8s.io
  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: app, namespace: demo}
    spec:
      rules:
      - {host: -x.demo.okdp.sandbox}
- name: an Ingress for the suffix itself
  allow: false
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: networking.k8s.io
  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: app, namespace: demo}
    spec:
      rules:
      - {host: okdp.sandbox}
- name: an Ingress for a name that only ends like the suffix
  allow: false
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: networking.k8s.io
  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: app, namespace: demo}
    spec:
      rules:
      - {host: airflow.demo.okdp.sandbox.evil.com}
- name: the old form <name>-<namespace>.<suffix> is refused
  allow: false
  message: hosts <label>.demo.okdp.sandbox
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: networking.k8s.io
  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: app, namespace: demo}
    spec:
      rules:
      - {host: airflow-demo.okdp.sandbox}
- name: the namespace itself as the host, no label
  allow: false
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: networking.k8s.io
  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: app, namespace: demo}
    spec:
      rules:
      - {host: demo.okdp.sandbox}
- name: a namespace that is the dash-suffix of another has none of its hosts
  allow: false
  message: hosts <label>.data.okdp.sandbox
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: data
  group: networking.k8s.io
  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: app, namespace: data}
    spec:
      rules:
      - {host: airflow.big-data.okdp.sandbox}
- name: the old form of big-data is refused to data too
  allow: false
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: data
  group: networking.k8s.io
  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: app, namespace: data}
    spec:
      rules:
      - {host: airflow-big-data.okdp.sandbox}
- name: big-data serves its own host
  allow: true
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: big-data
  group: networking.k8s.io
  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: app, namespace: big-data}
    spec:
      rules:
      - {host: airflow.big-data.okdp.sandbox}
- name: an Ingress with a defaultBackend and no rule is refused
  allow: false
  message: spec.defaultBackend
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: networking.k8s.io
  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: app, namespace: demo}
    spec:
      defaultBackend:
        service: {name: web, port: {number: 80}}
- name: an Ingress with a defaultBackend beside its rules is refused
  allow: false
  message: spec.defaultBackend
  operation: UPDATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: networking.k8s.io
  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: app, namespace: demo}
    spec:
      defaultBackend:
        service: {name: web, port: {number: 80}}
      rules:
      - {host: airflow.demo.okdp.sandbox}
- name: a platform namespace keeps its defaultBackend
  allow: true
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: keycloak
  group: networking.k8s.io
  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: app, namespace: keycloak}
    spec:
      defaultBackend:
        service: {name: web, port: {number: 80}}
- name: a Gateway listener on the project's own host
  allow: true
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: gateway.networking.k8s.io
  resource: gateways
  object:
    apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata: {name: gw, namespace: demo}
    spec:
      gatewayClassName: envoy
      listeners:
      - {name: https, port: 443, protocol: HTTPS, hostname: airflow.demo.okdp.sandbox}
- name: a Gateway listener on a listed host
  allow: true
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: gateway.networking.k8s.io
  resource: gateways
  object:
    apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata: {name: gw, namespace: demo}
    spec:
      gatewayClassName: envoy
      listeners:
      - {name: https, port: 443, protocol: HTTPS, hostname: grafana.okdp.sandbox}
- name: a Gateway listener on the identity provider's host
  allow: false
  message: a Gateway of demo has listeners
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: gateway.networking.k8s.io
  resource: gateways
  object:
    apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata: {name: gw, namespace: demo}
    spec:
      gatewayClassName: envoy
      listeners:
      - {name: https, port: 443, protocol: HTTPS, hostname: keycloak.okdp.sandbox}
- name: a Gateway listener with no hostname answers every host
  allow: false
  message: every listener has a hostname
  operation: UPDATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: gateway.networking.k8s.io
  resource: gateways
  object:
    apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata: {name: gw, namespace: demo}
    spec:
      gatewayClassName: envoy
      listeners:
      - {name: http, port: 80, protocol: HTTP}
- name: a Gateway listener on a wildcard of the suffix
  allow: false
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: gateway.networking.k8s.io
  resource: gateways
  object:
    apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata: {name: gw, namespace: demo}
    spec:
      gatewayClassName: envoy
      listeners:
      - {name: https, port: 443, protocol: HTTPS, hostname: '*.okdp.sandbox'}
- name: a platform namespace's Gateway is not bound
  allow: true
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: ingress-nginx
  group: gateway.networking.k8s.io
  resource: gateways
  object:
    apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata: {name: gw, namespace: ingress-nginx}
    spec:
      gatewayClassName: envoy
      listeners:
      - {name: http, port: 80, protocol: HTTP}
- name: an Ingress for a rule without host
  allow: false
  message: every rule has a host
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: networking.k8s.io
  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: app, namespace: demo}
    spec:
      rules:
      - {}
- name: an Ingress whose second rule is foreign
  allow: false
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: networking.k8s.io
  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: app, namespace: demo}
    spec:
      rules:
      - {host: airflow.demo.okdp.sandbox}
      - {host: keycloak.okdp.sandbox}
- name: an Ingress with a foreign tls host
  allow: false
  message: has certificates for hosts
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: networking.k8s.io
  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: app, namespace: demo}
    spec:
      rules:
      - {host: airflow.demo.okdp.sandbox}
      tls:
      - hosts: [keycloak.okdp.sandbox]
        secretName: x
- name: an Ingress with no rules or tls
  allow: true
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: networking.k8s.io
  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: app, namespace: demo}
    spec: {}
- name: a host the platform lists for the project
  allow: true
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: networking.k8s.io
  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: app, namespace: demo}
    spec:
      rules:
      - {host: grafana.okdp.sandbox}
- name: a host the platform lists for another project
  allow: false
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: team
  group: networking.k8s.io
  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: app, namespace: team}
    spec:
      rules:
      - {host: grafana.okdp.sandbox}
- name: a listed host in upper case
  allow: true
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: networking.k8s.io
  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: app, namespace: demo}
    spec:
      rules:
      - {host: Grafana.okdp.sandbox}
