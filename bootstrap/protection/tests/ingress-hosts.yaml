  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: networking.k8s.io
  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: app, namespace: demo}
    spec:
      rules:
      - {host: keycloak.okdp.sandbox}
- name: a Service is not covered
  allow: true
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: cert-manager.io
  resource: services
  object:
    apiVersion: v1
    kind: Service
    metadata:
      name: s
      namespace: demo
      annotations: {cert-manager.io/common-name: keycloak.okdp.sandbox}
