      issuerRef: {name: default-issuer, kind: ClusterIssuer}
      dnsNames: [airflow.demo.okdp.sandbox]
      commonName: keycloak.okdp.sandbox
- name: a Certificate with a foreign alt-names annotation
  allow: false
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: cert-manager.io
  resource: certificates
  object:
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: c
      namespace: demo
      annotations: {cert-manager.io/alt-names: keycloak.okdp.sandbox}
    spec:
      secretName: x
      issuerRef: {name: default-issuer, kind: ClusterIssuer}
      dnsNames: [airflow.demo.okdp.sandbox]
- name: a Certificate for the in-cluster service name
  allow: false
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: cert-manager.io
  resource: certificates
  object:
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata: {name: c, namespace: demo}
    spec:
      secretName: x
      issuerRef: {name: default-issuer, kind: ClusterIssuer}
      dnsNames: [app.demo.svc.cluster.local]
- name: a Certificate with no names
  allow: true
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: cert-manager.io
