  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: networking.k8s.io
  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: app
      namespace: demo
      annotations: {cert-manager.io/common-name: airflow.demo.okdp.sandbox}
    spec:
      rules:
      - {host: airflow.demo.okdp.sandbox}
- name: an Ingress with a foreign server alias in a list
  allow: false
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
