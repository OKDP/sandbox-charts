    metadata:
      name: app
      namespace: demo
      annotations: {nginx.ingress.kubernetes.io/rewrite-target: /}
    spec:
      rules:
      - {host: airflow.demo.okdp.sandbox}
- name: a Certificate for the project's own host
  allow: true
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: cert-manager.io
  resource: certificates
  object:
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata: {name: c, namespace: demo}
    spec:
      secretName: x
      issuerRef: {name: default-issuer, kind: ClusterIssuer}
      dnsNames: [airflow.demo.okdp.sandbox]
      commonName: airflow.demo.okdp.sandbox
- name: a Certificate for the identity provider
  allow: false
  message: a Certificate of demo names hosts
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: cert-manager.io
  resource: certificates
  object:
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata: {name: c, namespace: demo}
    spec:
      secretName: x
      issuerRef: {name: default-issuer, kind: ClusterIssuer}
      dnsNames: [keycloak.okdp.sandbox]
- name: a Certificate with a foreign commonName
  allow: false
  message: commonName
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: cert-manager.io
  resource: certificates
