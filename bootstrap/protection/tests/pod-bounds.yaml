  user: system:serviceaccount:demo:demo-spark
  namespace: demo
  group: ''
  resource: pods
  object:
    apiVersion: v1
    kind: Pod
    metadata:
      name: exec-1
      namespace: demo
      labels: {spark-app-selector: app-1, x: y}
    spec:
      serviceAccountName: demo-spark
      containers:
      - {name: main, image: 'spark:3.4'}
  oldObject:
    apiVersion: v1
