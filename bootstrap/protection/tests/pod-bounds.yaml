# okdp-pod-bounds: what a bounded ServiceAccount does with pods, configmaps, services and
# claims. Two instances: demo (the secrets and the claim prefix listed, the default owner
# label spark-app-selector) and team (no secret, no claim, its own owner label).
# Run by scripts/check-bootstrap.sh (scripts/policytest).
policies: ../policies.yaml
policy: okdp-pod-bounds
params:
- apiVersion: v1
  kind: ConfigMap
  metadata:
    name: demo-spark-pod-bounds
    namespace: demo
    labels: {okdp.io/pod-bounds: 'true'}
  data: {serviceAccount: demo-spark, secrets: 'demo-ca, demo-s3', pvcPrefixes: spark-exec-}
- apiVersion: v1
  kind: ConfigMap
  metadata:
    name: team-spark-pod-bounds
    namespace: team
    labels: {okdp.io/pod-bounds: 'true'}
  data: {serviceAccount: team-spark, secrets: '', ownerLabel: okdp.io/owner}
- apiVersion: v1
  kind: ConfigMap
  metadata:
    name: unrelated
    namespace: other
    labels: {a: b}
  data: {}
cases:
- name: a pod as the ServiceAccount, with its Secrets, is created
  allow: true
  operation: CREATE
  user: system:serviceaccount:demo:demo-spark
  namespace: demo
  group: ''
  resource: pods
  object:
    apiVersion: v1
    kind: Pod
    metadata:
      name: exec-1
      namespace: demo
      labels: {spark-app-selector: app-1, spark-role: executor}
    spec:
      serviceAccountName: demo-spark
      containers:
      - name: main
        image: spark:3.4
        env:
        - name: K
          valueFrom:
            secretKeyRef: {name: demo-s3, key: accessKey}
        envFrom:
        - secretRef: {name: demo-ca}
      volumes:
      - name: ca
        secret: {secretName: demo-ca}
      - name: tmp
        emptyDir: {}
      - name: p
        projected:
          sources:
          - secret: {name: demo-s3}
          - configMap: {name: x}
- name: a pod as another ServiceAccount is refused
  allow: false
  message: run as demo-spark
  operation: CREATE
  user: system:serviceaccount:demo:demo-spark
  namespace: demo
  group: ''
  resource: pods
  object:
    apiVersion: v1
    kind: Pod
    metadata:
      name: exec-1
      namespace: demo
      labels: {spark-app-selector: app-1, spark-role: executor}
    spec:
      serviceAccountName: default
      containers:
      - {name: main, image: 'spark:3.4'}
- name: a pod without a ServiceAccount is refused
  allow: false
  message: run as demo-spark
  operation: CREATE
  user: system:serviceaccount:demo:demo-spark
  namespace: demo
  group: ''
  resource: pods
  object:
    apiVersion: v1
    kind: Pod
    metadata:
      name: exec-1
      namespace: demo
      labels: {spark-app-selector: app-1, spark-role: executor}
    spec:
      containers:
      - {name: main, image: 'spark:3.4'}
- name: a pod mounting another Secret is refused
  allow: false
  message: mount no Secret but demo-ca, demo-s3
  operation: CREATE
  user: system:serviceaccount:demo:demo-spark
  namespace: demo
  group: ''
  resource: pods
  object:
    apiVersion: v1
    kind: Pod
    metadata:
      name: exec-1
      namespace: demo
      labels: {spark-app-selector: app-1, spark-role: executor}
    spec:
      serviceAccountName: demo-spark
      containers:
      - {name: main, image: 'spark:3.4'}
      volumes:
      - name: s
        secret: {secretName: hub-secret}
- name: a pod projecting another Secret is refused
  allow: false
  message: mount no Secret
  operation: CREATE
  user: system:serviceaccount:demo:demo-spark
  namespace: demo
  group: ''
  resource: pods
  object:
    apiVersion: v1
    kind: Pod
    metadata:
      name: exec-1
      namespace: demo
      labels: {spark-app-selector: app-1, spark-role: executor}
    spec:
      serviceAccountName: demo-spark
      containers:
      - {name: main, image: 'spark:3.4'}
      volumes:
      - name: p
        projected:
          sources:
          - secret: {name: hub-secret}
- name: a pod mounting a csi volume is refused
  allow: false
  message: csi, flexVolume
  operation: CREATE
  user: system:serviceaccount:demo:demo-spark
  namespace: demo
  group: ''
  resource: pods
  object:
    apiVersion: v1
    kind: Pod
    metadata:
      name: exec-1
      namespace: demo
      labels: {spark-app-selector: app-1, spark-role: executor}
    spec:
      serviceAccountName: demo-spark
      containers:
      - {name: main, image: 'spark:3.4'}
      volumes:
      - name: c
        csi: {driver: secrets-store.csi.k8s.io}
- name: a pod reading another Secret in its env is refused
  allow: false
  message: read no Secret but
  operation: CREATE
  user: system:serviceaccount:demo:demo-spark
  namespace: demo
  group: ''
  resource: pods
  object:
    apiVersion: v1
    kind: Pod
    metadata:
      name: exec-1
      namespace: demo
      labels: {spark-app-selector: app-1, spark-role: executor}
    spec:
      serviceAccountName: demo-spark
      containers:
      - name: main
        image: spark:3.4
        env:
        - name: K
          valueFrom:
            secretKeyRef: {name: hub-secret, key: k}
- name: a pod reading another Secret with envFrom is refused
  allow: false
  message: read no Secret but
  operation: CREATE
  user: system:serviceaccount:demo:demo-spark
  namespace: demo
  group: ''
  resource: pods
  object:
    apiVersion: v1
    kind: Pod
    metadata:
      name: exec-1
      namespace: demo
      labels: {spark-app-selector: app-1, spark-role: executor}
    spec:
      serviceAccountName: demo-spark
      containers:
      - name: main
        image: spark:3.4
        envFrom:
        - secretRef: {name: hub-secret}
- name: an init container reading another Secret is refused
  allow: false
  message: read no Secret but
  operation: CREATE
  user: system:serviceaccount:demo:demo-spark
  namespace: demo
  group: ''
  resource: pods
  object:
    apiVersion: v1
    kind: Pod
    metadata:
      name: exec-1
      namespace: demo
      labels: {spark-app-selector: app-1, spark-role: executor}
    spec:
      serviceAccountName: demo-spark
      containers:
      - {name: main, image: 'spark:3.4'}
      initContainers:
      - name: i
        image: busybox
        env:
        - name: K
          valueFrom:
            secretKeyRef: {name: hub-secret, key: k}
- name: a pod mounting another user's claim is refused
  allow: false
  message: mount no claim but those named spark-exec-*
  operation: CREATE
  user: system:serviceaccount:demo:demo-spark
  namespace: demo
  group: ''
  resource: pods
  object:
    apiVersion: v1
    kind: Pod
    metadata:
      name: exec-1
      namespace: demo
      labels: {spark-app-selector: app-1, spark-role: executor}
    spec:
      serviceAccountName: demo-spark
      containers:
      - {name: main, image: 'spark:3.4'}
      volumes:
      - name: home
        persistentVolumeClaim: {claimName: claim-alice}
