    metadata:
      name: exec-1
      namespace: demo
      labels: {spark-app-selector: app-1, spark-role: executor}
    spec:
      serviceAccountName: demo-spark
      containers:
      - {name: main, image: 'spark:3.4'}
- name: 'a pod it owns changes its image: refused'
