  namespace: demo
  group: ''
  resource: pods
  object:
    apiVersion: v1
    kind: Pod
    metadata:
      name: exec-1
      namespace: demo
      labels: &id001 {app: hub}
    spec:
      serviceAccountName: demo-spark
      containers:
      - {name: main, image: 'evil:1'}
  oldObject:
    apiVersion: v1
    kind: Pod
    metadata:
      name: exec-1
      namespace: demo
      labels: *id001
    spec:
      serviceAccountName: demo-spark
      containers:
      - {name: main, image: 'spark:3.4'}
- name: another instance's pod without the label cannot be relabelled
