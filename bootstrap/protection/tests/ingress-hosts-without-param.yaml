# okdp-ingress-hosts without its ConfigMap okdp-ingress-hosts: the binding's
# parameterNotFoundAction is Deny, a namespace that is not the platform's own serves nothing.
policies: ../ingress-hosts.yaml
policy: okdp-ingress-hosts
namespaces: ../../namespaces.yaml
params: []
cases:
- name: without its param, the policy refuses
  allow: false
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: networking.k8s.io
  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: app, namespace: demo}
    spec:
      rules:
      - {host: airflow.demo.okdp.sandbox}
      tls:
      - hosts: [airflow.demo.okdp.sandbox]
        secretName: x
  message: no param found
- name: the platform's own namespace serves its host
  allow: true
  operation: CREATE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: keycloak
  group: networking.k8s.io
  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: app, namespace: keycloak}
    spec:
      rules:
      - {host: keycloak.okdp.sandbox}
- name: an Ingress deleted
  allow: true
  operation: DELETE
  user: system:serviceaccount:argocd:argocd-application-controller
  namespace: demo
  group: networking.k8s.io
  resource: ingresses
  object:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: app, namespace: demo}
    spec:
      rules:
      - {host: keycloak.okdp.sandbox}
