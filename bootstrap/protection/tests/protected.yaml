# okdp-protected: DELETE of a CRD, a Namespace, a Deployment, StatefulSet or DaemonSet
# labelled okdp.io/protected=true. Run by scripts/check-bootstrap.sh (scripts/policytest).
policies: ../policies.yaml
policy: okdp-protected
cases:
  - name: a labelled Deployment is not deleted
    allow: false
    message: is protected by OKDP
    operation: DELETE
    user: kubernetes-admin
    namespace: cert-manager
    group: apps
    resource: deployments
    oldObject:
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: cert-manager, namespace: cert-manager, labels: {okdp.io/protected: "true"}}
  - name: a labelled StatefulSet is not deleted
    allow: false
    operation: DELETE
    user: kubernetes-admin
    namespace: openbao
    group: apps
    resource: statefulsets
    oldObject:
      apiVersion: apps/v1
      kind: StatefulSet
      metadata: {name: openbao, namespace: openbao, labels: {okdp.io/protected: "true"}}
  - name: a labelled Namespace is not deleted
    allow: false
    operation: DELETE
    user: kubernetes-admin
    namespace: ""
    group: ""
    resource: namespaces
    oldObject:
      apiVersion: v1
      kind: Namespace
      metadata: {name: keycloak, labels: {okdp.io/protected: "true"}}
  - name: a labelled CRD is not deleted
    allow: false
    operation: DELETE
    user: kubernetes-admin
    namespace: ""
    group: apiextensions.k8s.io
    resource: customresourcedefinitions
    oldObject:
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata: {name: certificates.cert-manager.io, labels: {okdp.io/protected: "true"}}
  - name: an unlabelled Deployment is deleted
    allow: true
    operation: DELETE
    user: kubernetes-admin
    namespace: demo
    group: apps
    resource: deployments
    oldObject:
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: app, namespace: demo, labels: {app: app}}
  - name: the label at another value does not protect
    allow: true
    operation: DELETE
    user: kubernetes-admin
    namespace: demo
    group: apps
    resource: deployments
    oldObject:
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: app, namespace: demo, labels: {okdp.io/protected: "false"}}
  - name: a labelled Deployment is created and updated
    allow: true
    operation: UPDATE
    user: kubernetes-admin
    namespace: cert-manager
    group: apps
    resource: deployments
    object:
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: cert-manager, namespace: cert-manager, labels: {okdp.io/protected: "true"}}
    oldObject:
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: cert-manager, namespace: cert-manager, labels: {okdp.io/protected: "true"}}
  - name: a labelled Service is not covered
    allow: true
    operation: DELETE
    user: kubernetes-admin
    namespace: cert-manager
    group: ""
    resource: services
    oldObject:
      apiVersion: v1
      kind: Service
      metadata: {name: cert-manager, namespace: cert-manager, labels: {okdp.io/protected: "true"}}
