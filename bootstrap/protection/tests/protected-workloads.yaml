# okdp-protected-workloads: DELETE of a Deployment, StatefulSet or DaemonSet whose pod
# template carries okdp.io/protected=true, whatever its own labels.
policies: ../policies.yaml
policy: okdp-protected-workloads
cases:
  - name: a workload whose pod template is labelled is not deleted
    allow: false
    message: pod template label
    operation: DELETE
    user: kubernetes-admin
    namespace: ingress-nginx
    group: apps
    resource: deployments
    oldObject:
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: ingress-nginx-controller, namespace: ingress-nginx}
      spec: {template: {metadata: {labels: {okdp.io/protected: "true"}}}}
  - name: a DaemonSet whose pod template is labelled is not deleted
    allow: false
    operation: DELETE
    user: kubernetes-admin
    namespace: kube-tools
    group: apps
    resource: daemonsets
    oldObject:
      apiVersion: apps/v1
      kind: DaemonSet
      metadata: {name: tool, namespace: kube-tools}
      spec: {template: {metadata: {labels: {okdp.io/protected: "true"}}}}
  - name: a pod template labelled at another value does not protect
    allow: true
    operation: DELETE
    user: kubernetes-admin
    namespace: demo
    group: apps
    resource: deployments
    oldObject:
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: app, namespace: demo}
      spec: {template: {metadata: {labels: {okdp.io/protected: "false"}}}}
  - name: a pod template without labels does not protect
    allow: true
    operation: DELETE
    user: kubernetes-admin
    namespace: demo
    group: apps
    resource: deployments
    oldObject:
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: app, namespace: demo}
      spec: {template: {metadata: {}}}
  - name: a workload without a pod template spec does not fail the deletion
    allow: true
    operation: DELETE
    user: kubernetes-admin
    namespace: demo
    group: apps
    resource: deployments
    oldObject:
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: app, namespace: demo}
      spec: {}
