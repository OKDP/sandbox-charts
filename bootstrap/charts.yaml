# The dependencies of the platform: what the compiled tree needs and OKDP does not
# compile, installed with helm before it (bootstrap/README.md), each a release of its
# upstream chart (or of a chart of this directory) with its values files of this
# directory. okdp-sandbox's scripts/bootstrap.sh installs them in this order (with the
# few steps of bootstrap/README.md before and between them: the namespaces and
# their Pod Security levels, the CA bundle, the admission policies, the CoreDNS
# patch, Keycloak's database, OpenBao's init);
# scripts/check-bootstrap.sh checks that bootstrap/README.md's commands name these
# charts and versions, and with --helm renders them.
#   <release>: namespace, chart (an oci:// reference, or a chart name of repo, an
#   https:// repository) and version, or path (a chart of this directory, no
#   version), values (relative to this directory), timeout (helm --timeout, default
#   5m)
# Every chart that is not of this directory is pinned to its content, and
# scripts/bootstrap.sh installs nothing else (a tag moved or a repository
# compromised upstream installs nothing new, with cluster-admin):
#   sha256   a chart of a repository (repo): the sha256 of its package, the .tgz
#            helm pull downloads, checked before the install;
#   digest   an OCI chart: the digest of its manifest, which the install names
#            (oci://...@sha256:...: the registry serves that content or nothing).
# The images are pinned in the values files, by digest (check-bootstrap.sh --helm
# fails on one that is not). scripts/bump-bootstrap.sh prints the current sha256,
# digests and the digests of the tags, to move them together with a version.
releases:
  cert-manager:
    namespace: cert-manager
    repo: https://charts.jetstack.io
    chart: cert-manager
    version: v1.21.2
