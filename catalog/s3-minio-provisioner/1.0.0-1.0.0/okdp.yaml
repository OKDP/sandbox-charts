# OKDP's part of s3-minio-provisioner (okdp-compiler): no upstream chart, no
# dependency in Chart.yaml. It deploys no store: it provisions the claims of
# s3 connections bound to its instance on a store OKDP neither deploys nor
# manages (the sandbox's RustFS, a company's MinIO), the connection its
# parameter store names, through MinIO's admin API (madmin v3), which MinIO
# and RustFS serve under /minio/admin/v3/. A provider of claims for a store
# that is a platform dependency: what seaweedfs does for its own store.
# ${{ ... }} is a CEL expression; the shell's and JavaScript's ${...} stay
# literal.

roles: [storage]
dependsOn: [external-secrets]
# It provisions s3 connections: a bucket and an identity limited to it, its
# keys a generated Secret, for each claim bound to its instance (claims: id,
# contract, namespace, name, request), published under the claim's ID.
provisions: [s3]

vars:
  # The store: the connection the parameter names, completed against the
  # contract (region, pathStyle defaulted), {} when unset (errors).
  store: >-
    ${{ type(values.store) == map ? values.store : {} }}
  # The endpoint the Job calls: the in-cluster one when the store has one.
  endpoint: ${{ first([store.?internalUrl.orValue(''), store.?apiUrl.orValue('')]) }}
  region: ${{ first([store.?region.orValue(''), 'us-east-1']) }}
  pathStyle: ${{ store.?pathStyle.orValue(true) }}
  # The platform's CA bundle (a Secret of each namespace, key ca.crt), which
  # the Job trusts when it calls an https endpoint; "" when unset (the
  # store's certificate chains to a public CA, or the endpoint is http).
  caBundle: ${{ global.okdp.?tls.?caBundleSecret.orValue('') }}
  trustCa: ${{ caBundle != '' && endpoint.startsWith('https://') }}
  name: ${{ okdpFullname('provision') }}
  jobLabels: ${{ okdpLabels('provision') }}
  # The claims bound to the instance: a bucket each, named after the claim's
  # ID (DNS-1123 labels joined by dots, 63 characters at most: a valid bucket
  # name), a policy limited to it, and its identity, the keys of the
  # generated Secret of its connection (<id>-s3-credentials), mounted in the
  # Job's volume claim-<i>; the paths it requests, seeded.
  claimed: >-
    ${{ claims.transformList(i, c, {'id': c.id, 'bucket': c.id, 'policy': 'okdp-claim-' + c.id,
          'paths': c.request.paths, 'secret': c.id + '-s3-credentials', 'volume': 'claim-' + string(i)}) }}
  # What the Job provisions (claims.json of its ConfigMap): no key in it.
  config: >-
    ${{ toJson({'endpoint': endpoint, 'region': region, 'adopt': values.adopt, 'claims': claimed.map(c, {'id': c.id,
          'bucket': c.bucket, 'policy': c.policy, 'paths': c.paths, 'secret': c.secret, 'dir': '/claims/' + c.volume})}) }}
  claimsText: |-
    | Claim | Bucket | Paths | Credentials Secret |
    |---|---|---|---|
    ${{ claimed.map(c, '| `' + c.id + '` | `' + c.bucket + '` | ' + (c.paths.size() > 0 ? c.paths.map(p, '`' + p + '`').join(', ') : 'none') + ' | `' + c.secret + '` |').join('\n') }}

errors:
  - $if: ${{ store.size() == 0 }}
    $value: >-
      s3-minio-provisioner: store is required: the s3 connection of the store the claims are
      provisioned on, its credentials Secret (secretRef) an identity of the store allowed to
      create buckets, users and policies
  - $if: >-
      ${{ store.size() > 0 && !endpoint.startsWith('http://') && !endpoint.startsWith('https://') }}
    $value: >-
      s3-minio-provisioner: store: its endpoint ${{ quote(endpoint) }} (internalUrl, else apiUrl)
      is not an http:// or https:// URL

objects:
  # The provisioning of the claims: a post-install/post-upgrade hook Job,
  # recreated at every install and upgrade (a Job is immutable), every step
  # idempotent, so that an added claim or path is picked up and a changed
  # policy rewritten. None without a claim. The claims' Secrets are
  # generated by External Secrets (provides): the pod starts once they
  # exist. Nothing is removed: a claim that is gone leaves its bucket, its
  # user and its policy on the store, for its claimer to come back to under
  # the same ID; an operator removes them. A bucket of a claim's name that
  # exists on the store without the tag okdp.io/claim=<claim ID> the Job puts
  # on the ones it creates is not the Job's: the claim is refused unless the
  # instance's adopt is set.
  - $for: "x in (claimed.size() > 0 ? [name] : [])"
    $each:
      - apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${{ x }}
          labels: ${{ jobLabels }}
        data:
          claims.json: ${{ config }}
          # A client of MinIO's admin API on Node's standard library alone
          # (fetch, crypto): requests signed with AWS Signature V4, and the
          # bodies the admin API wants encrypted (add-user) sealed as madmin
          # does (EncryptData: PBKDF2-SHA256 and AES-256-GCM, the sio DARE
          # format), so that no client binary (mc) is needed.
          provision.mjs: |
            // Provisions the claims of /config/claims.json on the store through
            // MinIO's admin API (madmin v3), as the identity ADMIN_ACCESS_KEY /
            // ADMIN_SECRET_KEY, each step idempotent: the claim's bucket (created
            // and tagged with the claim's ID; one that exists is the claim's only
            // when it carries that tag, or without a tag under adopt), its
            // policy, its user (the access key of its Secret) with that policy,
            // then the prefixes it requests, seeded by the claim's own identity.
            // Prints no key.
            import crypto from 'node:crypto';
            import fs from 'node:fs';

            const cfg = JSON.parse(fs.readFileSync('/config/claims.json', 'utf8'));
            const admin = { ak: process.env.ADMIN_ACCESS_KEY, sk: process.env.ADMIN_SECRET_KEY };
            const base = new URL(cfg.endpoint);
            const prefix = base.pathname.replace(/\/+$/, '');
            const deadline = Date.now() + 300000;

            const sha256 = (b) => crypto.createHash('sha256').update(b).digest('hex');
            const hmac = (k, s) => crypto.createHmac('sha256', k).update(s).digest();
            const uri = (s) => encodeURIComponent(s).replace(/[!'()*]/g, (c) => '%' + c.charCodeAt(0).toString(16).toUpperCase());
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
            const read = (dir, key) => fs.readFileSync(dir + '/' + key, 'utf8').trim();

            class S3Error extends Error {
              constructor(message, status, code) { super(message); this.status = status; this.code = code; }
            }

            // A request of the identity id, signed with AWS Signature V4 (service
            // s3, the store's region); the answer's text, or an S3Error.
            async function request(id, method, path, query = {}, body = Buffer.alloc(0), extra = {}) {
              const amzDate = new Date().toISOString().replace(/[-:]|\.\d{3}/g, '');
              const day = amzDate.slice(0, 8);
              const fullPath = prefix + path;
              const qs = Object.keys(query).sort().map((k) => uri(k) + '=' + uri(query[k])).join('&');
              const hash = sha256(body);
              const headers = { ...extra, host: base.host, 'x-amz-content-sha256': hash, 'x-amz-date': amzDate };
              const names = Object.keys(headers).sort();
              const canonical = [method, fullPath.split('/').map(uri).join('/'), qs,
                names.map((n) => n + ':' + headers[n] + '\n').join(''), names.join(';'), hash].join('\n');
              const scope = [day, cfg.region, 's3', 'aws4_request'].join('/');
              const key = hmac(hmac(hmac(hmac('AWS4' + id.sk, day), cfg.region), 's3'), 'aws4_request');
              const signature = crypto.createHmac('sha256', key)
                .update(['AWS4-HMAC-SHA256', amzDate, scope, sha256(canonical)].join('\n')).digest('hex');
              delete headers.host;
              headers.authorization = 'AWS4-HMAC-SHA256 Credential=' + id.ak + '/' + scope
                + ', SignedHeaders=' + names.join(';') + ', Signature=' + signature;
              const res = await fetch(base.origin + fullPath + (qs ? '?' + qs : ''),
                { method, headers, body: body.length > 0 ? body : undefined });
              const text = await res.text();
              if (res.status >= 300) {
                const code = (/<Code>([^<]*)<\/Code>/.exec(text) || [])[1] || '';
                throw new S3Error(method + ' ' + path + ': HTTP ' + res.status + ' ' + (code || text.slice(0, 200)), res.status, code);
              }
              return text;
            }

            // madmin's EncryptData, with the requester's secret key: salt (32
            // bytes) | algorithm (0x02: PBKDF2-SHA256, 8192 rounds, AES-256-GCM)
            // | nonce (8 bytes) | the sio DARE stream of the data, one final
            // fragment (the data is smaller than a fragment, 16 KiB).
            function encrypt(password, data) {
              const salt = crypto.randomBytes(32);
              const key = crypto.pbkdf2Sync(password, salt, 8192, 32, 'sha256');
              const nonce = crypto.randomBytes(8);
              const seal = (seq, plaintext, ad) => {
                const iv = Buffer.alloc(12);
                nonce.copy(iv);
                iv.writeUInt32LE(seq, 8);
                const c = crypto.createCipheriv('aes-256-gcm', key, iv);
                c.setAAD(ad);
                return Buffer.concat([c.update(plaintext), c.final(), c.getAuthTag()]);
              };
              const adTag = seal(0, Buffer.alloc(0), Buffer.alloc(0));
              const fragment = seal(1, Buffer.from(data), Buffer.concat([Buffer.from([0x80]), adTag]));
              return Buffer.concat([salt, Buffer.from([0x02]), nonce, fragment]);
            }

            // Retries what may pass later: the store unreachable or unavailable
            // (5xx), or one of codes (a user just created, not yet known), until
            // the deadline; anything else fails at once.
            async function retry(what, fn, codes = []) {
              for (let delay = 2000; ; delay = Math.min(delay * 2, 15000)) {
                try {
                  return await fn();
                } catch (e) {
                  const transient = !(e instanceof S3Error) || e.status >= 500 || codes.includes(e.code);
                  if (!transient || Date.now() + delay > deadline) throw e;
                  console.log('.. ' + what + ': ' + e.message + ', retrying');
                  await sleep(delay);
                }
              }
            }

            // The claim's identity reads, lists and writes its bucket, nothing else.
            const policyOf = (bucket) => JSON.stringify({
              Version: '2012-10-17',
              Statement: [
                { Effect: 'Allow', Action: ['s3:GetBucketLocation', 's3:ListBucket', 's3:ListBucketMultipartUploads'],
                  Resource: ['arn:aws:s3:::' + bucket] },
                { Effect: 'Allow', Action: ['s3:GetObject', 's3:PutObject', 's3:DeleteObject',
                  's3:AbortMultipartUpload', 's3:ListMultipartUploadParts'], Resource: ['arn:aws:s3:::' + bucket + '/*'] },
              ],
            });

            // A bucket the Job created carries the tag okdp.io/claim = the claim's
            // ID. The store's buckets are one namespace: a bucket of the claim's
            // name that exists without that tag is someone else's (an operator's,
            // another system's, a claim's of an older version of this package),
            // and granting the claim's identity on it would hand it over.
            const TAG = 'okdp.io/claim';

            class Refused extends Error {}

            async function claimOf(bucket) {
              let text;
              try {
                text = await request(admin, 'GET', '/' + bucket, { tagging: '' });
              } catch (e) {
                if (e.code === 'NoSuchTagSet') return '';
                throw e;
              }
              for (const m of text.matchAll(/<Tag>\s*<Key>([^<]*)<\/Key>\s*<Value>([^<]*)<\/Value>\s*<\/Tag>/g)) {
                if (m[1] === TAG) return m[2];
              }
              return '';
            }

            async function mark(c) {
              const body = Buffer.from('<Tagging><TagSet><Tag><Key>' + TAG + '</Key><Value>' + c.id
                + '</Value></Tag></TagSet></Tagging>');
              await request(admin, 'PUT', '/' + c.bucket, { tagging: '' }, body,
                { 'content-md5': crypto.createHash('md5').update(body).digest('base64') });
            }

            // Creates the claim's bucket and tags it; a bucket that exists is the
            // claim's only when it carries the tag with the claim's ID, or, with
            // adopt (the provider's own switch, never a claim's), when it carries
            // none: it is tagged then.
            async function ensureBucket(c) {
              let created = false;
              await retry('bucket ' + c.bucket, async () => {
                try {
                  await request(admin, 'PUT', '/' + c.bucket);
                  created = true;
                } catch (e) {
                  // MinIO answers BucketAlreadyOwnedByYou, RustFS BucketAlreadyExists.
                  if (!['BucketAlreadyOwnedByYou', 'BucketAlreadyExists'].includes(e.code)) throw e;
                }
              });
              if (created) {
                console.log('   bucket created');
                return retry('tag of bucket ' + c.bucket, () => mark(c));
              }
              const owner = await retry('tag of bucket ' + c.bucket, () => claimOf(c.bucket));
              if (owner === c.id) {
                console.log('   the bucket exists, tagged with this claim: kept');
              } else if (owner === '' && cfg.adopt) {
                console.log('   the bucket exists without a tag: adopted (adopt is set)');
                await retry('tag of bucket ' + c.bucket, () => mark(c));
              } else {
                throw new Refused('the bucket ' + c.bucket + ' exists and ' + (owner === ''
                  ? 'was not created by this provisioner (no ' + TAG + ' tag): adopt it with the adopt parameter if it is the claim\'s'
                  : 'belongs to the claim ' + owner));
              }
            }

            async function provision(c) {
              const user = { ak: read(c.dir, 'accessKey'), sk: read(c.dir, 'secretKey') };
              console.log('>> claim ' + c.id + ': bucket ' + c.bucket);
              await ensureBucket(c);
              console.log('   policy ' + c.policy);
              await retry('policy ' + c.policy, () => request(admin, 'PUT', '/minio/admin/v3/add-canned-policy',
                { name: c.policy }, Buffer.from(policyOf(c.bucket))));
              console.log('   user: the access key of Secret ' + c.secret);
              await retry('user', () => request(admin, 'PUT', '/minio/admin/v3/add-user', { accessKey: user.ak },
                encrypt(admin.sk, JSON.stringify({ secretKey: user.sk, status: 'enabled' }))));
              await retry('policy of the user', () => request(admin, 'PUT', '/minio/admin/v3/set-user-or-group-policy',
                { policyName: c.policy, userOrGroup: user.ak, isGroup: 'false' }));
              for (const p of c.paths) {
                console.log('   path ' + p + '/');
                await retry('path ' + p, () => request(user, 'PUT', '/' + c.bucket + '/' + p + '/.keep'),
                  ['InvalidAccessKeyId', 'AccessDenied', 'SignatureDoesNotMatch']);
              }
            }

            // A claim whose bucket is refused gets nothing (no policy, no user) and
            // the others are served; the Job fails at the end so that it is seen.
            const refused = [];
            try {
              console.log('>> store ' + base.origin + prefix + ' (MinIO admin API), ' + cfg.claims.length + ' claim(s)');
              for (const c of cfg.claims) {
                try {
                  await provision(c);
                } catch (e) {
                  if (!(e instanceof Refused)) throw e;
                  console.error('!! claim ' + c.id + ': ' + e.message);
                  refused.push(c.id);
                }
              }
            } catch (e) {
              console.error('!! ' + e.message);
              process.exit(1);
            }
            if (refused.length > 0) {
              console.error('!! refused: ' + refused.join(', '));
              process.exit(1);
            }
            console.log('>> provisioning complete');
      # The compiler's hardened Job (okdpJob): user 1000, no capability, no
      # token, a read-only root, seccomp RuntimeDefault. A hook Job, recreated
      # at every install and upgrade (before-hook-creation).
      - $spread: >-
          ${{ okdpJob({'name': x, 'component': 'provision', 'backoffLimit': 20,
                'hook': {'helm': 'post-install,post-upgrade'},
                'pod': {'restartPolicy': 'OnFailure', 'runAsUser': 1000, 'runAsGroup': 1000,
                  'containers': [{'name': 'provision', 'image': values.image, 'imagePullPolicy': 'IfNotPresent',
                    'command': ['node', '/config/provision.mjs'],
                    'env': [{'name': 'ADMIN_ACCESS_KEY', 'valueFrom': {'secretKeyRef': {'name': store.secretRef.name, 'key': 'accessKey'}}},
                            {'name': 'ADMIN_SECRET_KEY', 'valueFrom': {'secretKeyRef': {'name': store.secretRef.name, 'key': 'secretKey'}}}]
                            + (trustCa ? [{'name': 'NODE_EXTRA_CA_CERTS', 'value': '/etc/okdp/ca/ca.crt'}] : []),
                    'resources': {'requests': {'cpu': '50m', 'memory': '64Mi'}, 'limits': {'memory': '256Mi'}},
                    'volumeMounts': [{'name': 'config', 'mountPath': '/config', 'readOnly': true}]
                            + claimed.map(c, {'name': c.volume, 'mountPath': '/claims/' + c.volume, 'readOnly': true})
                            + (trustCa ? [{'name': 'ca', 'mountPath': '/etc/okdp/ca', 'readOnly': true}] : [])}],
                  'volumes': [{'name': 'config', 'configMap': {'name': x}}]
                            + claimed.map(c, {'name': c.volume, 'secret': {'secretName': c.secret,
                                'items': [{'key': 'accessKey', 'path': 'accessKey'}, {'key': 'secretKey', 'path': 'secretKey'}]}})
                            + (trustCa ? [{'name': 'ca', 'secret': {'secretName': caBundle, 'items': [{'key': 'ca.crt', 'path': 'ca.crt'}]}}] : [])}}) }}

# okdp.info.yaml, listed by the console: no URL (no UI of its own).
instance:
  usage: |
    Provisions the claims of s3 connections bound to this instance through MinIO's
    admin API, on the S3 store at `${{ endpoint }}`: a bucket per claim, named after
    its ID, and an identity that reads, lists and writes it only, its keys the claim's
    credentials Secret. The store is not OKDP's: its buckets outlive their claims.${{ claimed.size() > 0 ? '\n\n' + claimsText : '' }}

# One output per claim bound to the instance, named after its ID: the
# store's endpoints, region and addressing, the claim's bucket and the paths
# seeded in it, the keys of its identity in a Secret generated once by ESO
# (<id>-s3-credentials, labelled okdp.io/credentials-s3), which the Job
# creates on the store.
provides:
  - $for: c in claimed
    $each:
      contract: s3
      name: ${{ c.id }}
      values:
        apiUrl: ${{ store.apiUrl }}
        internalUrl:
          $if: ${{ store.?internalUrl.orValue('') != '' }}
          $value: ${{ store.?internalUrl.orValue('') }}
        bucket: ${{ c.bucket }}
        paths: ${{ c.paths }}
        region: ${{ region }}
        pathStyle: ${{ pathStyle }}
      secret:
        generate:
          - {key: accessKey, length: 20, symbols: 0}
          - {key: secretKey, length: 40, symbols: 0}
