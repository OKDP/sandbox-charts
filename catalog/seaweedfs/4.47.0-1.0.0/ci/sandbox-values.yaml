# A platform's S3 store as an instance (the sandbox's default/storage), here
# in the project demo: its hosts are <label>.demo.
consoleHost: storage.demo
apiHost: storage-api.demo
grants:
  - principal: platformAdmin
    credentialsSecret: {name: creds-seaweedfs-s3, accessKeyKey: accessKey, secretKeyKey: secretKey}
    actions: [Admin]
outputSecretRef: creds-seaweedfs-s3
