# error: seaweedfs: upstream.seaweedfs.s3.createBuckets: s3.createBuckets is set by the platform and cannot be changed
# A bucket appended to the chart's createBuckets, which would turn on its
# bucket hook (no securityContext, the default ServiceAccount's token):
# refused (protect), the buckets are the parameter's.
upstream:
  seaweedfs:
    s3:
      createBuckets:
        - {name: archive}
