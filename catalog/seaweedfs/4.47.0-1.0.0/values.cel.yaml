# The values of the seaweedfs chart computed from the parameters, over
# seaweedfs.defaults.yaml: master, volume,
# filer (its UI behind OKDP's sign-in proxy, okdp.yaml) and the standalone S3 gateway. Its bucket hook
# is off (no s3.createBuckets, protected): OKDP's provisioning Job creates
# `buckets` and the buckets of the claims (okdp.yaml).
seaweedfs:
  nameOverride: ${{ release.name }}
  fullnameOverride: ${{ release.name }}
  global:
    seaweedfs:
      image:
        name: chrislusf/seaweedfs
      # Off (upstream default): its security ConfigMap writes random JWT
      # keys it reads back from the cluster with lookup (helm template and
      # install differ), and its gRPC mTLS leaves a hook without a client
      # certificate. The JWT keys are the environment's instead
      # (extraEnvironmentVars, below).
      enableSecurity: false
      # The JWT keys of every component,
      # from the Secret generated once by ESO (okdp.yaml, objects): the
      # master signs the volume servers' writes (jwt.signing), the filer
      # takes the writes over HTTP signed only (jwt.filer_signing: the S3
      # gateway signs its own). The chart's own variables (the cluster's
      # master and filer) stay: maps merge.
      extraEnvironmentVars:
        WEED_JWT_SIGNING_KEY:
          secretKeyRef: {name: "${{ jwtSecret }}", key: volumeWrite}
        WEED_JWT_FILER_SIGNING_KEY:
          secretKeyRef: {name: "${{ jwtSecret }}", key: filerWrite}
      # Named after the release (upstream default: seaweedfs).
      serviceAccountName: ${{ release.name }}
      # Off (upstream default: on): the ClusterRole <release>-rw-cr, pods
      # read and written in every namespace, and its ClusterRoleBinding to
      # the ServiceAccount, a leftover of a migration of the chart that no
      # component uses (no seaweedfs binary speaks to the Kubernetes API),
      # cluster-scoped objects a project's confined deployer refuses. Nor
      # the ServiceAccount's token mounted in the pods: none reads it.
      createClusterRole: false
      automountServiceAccountToken: false
  image:
    tag: ${{ imageTag }}
  master:
    data:
      storageClass: ${{ class }}
      size: ${{ str(values.masterStorage) }}Gi
    logs:
      storageClass: ${{ class }}
      size: ${{ str(values.masterLogStorage) }}Gi
  volume:
    replicas: ${{ values.volumeReplicas }}
    dataDirs:
      - name: data
        type: persistentVolumeClaim
        storageClass: ${{ class }}
        size: ${{ str(values.volumeStorage) }}Gi
        maxVolumes: 0
  filer:
    data:
      storageClass: ${{ class }}
      size: ${{ str(values.filerStorage) }}Gi
    logs:
      storageClass: ${{ class }}
      size: ${{ str(values.filerLogStorage) }}Gi
  s3:
    # Rendered by ESO from the grants' Secrets (OKDP's objects, okdp.yaml).
    existingConfigSecret: ${{ s3ConfigSecret }}
    # The S3 gateway reads its configuration at startup: Reloader restarts it
    # when ESO updates a Secret (a grant added or its keys changed, the
    # IAM/STS file changed); the checksum of the IAM/STS template rolls it
    # on a change of the template.
    annotations:
      secret.reloader.stakater.com/reload: ${{ s3ConfigSecret }},${{ iamSecret }}
    podAnnotations:
      checksum/iam: ${{ sha256(iamTemplate) }}
    extraVolumes: |
      - name: auth-config
        secret:
          secretName: ${{ iamSecret }}
    extraArgs:
      $if: ${{ stsEnabled }}
      $value: ["-iam.config=/etc/seaweed/iam/iam.json"]
    ingress:
      className: ${{ global.okdp.ingress.className }}
      annotations: ${{ platform.ingressAnnotations }}
      host: ${{ apiHost }}
      tls:
        - secretName: ${{ okdpFullname('s3-tls') }}
          hosts: ["${{ apiHost }}"]
