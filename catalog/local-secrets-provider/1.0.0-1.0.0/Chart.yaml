apiVersion: v2
name: local-secrets-provider
description: >-
  Writes the Kubernetes Secrets the platform services need from a list, their
  credentials random values External Secrets Operator generates in the cluster, or keys
  it reads from the platform's secret store: a local stand-in for an external secret
  manager in sandbox environments. Each Secret stays in the instance's namespace.
type: application
# <upstream>-<okdp semver>: catalog/local-secrets-provider/<version>/, a new directory per version.
version: 1.0.0-1.0.0
appVersion: "1.0.0"
home: https://okdp.io
sources:
  - https://github.com/OKDP/sandbox-charts
# No dependency: the generated Secrets are OKDP's own objects (okdp.yaml).
